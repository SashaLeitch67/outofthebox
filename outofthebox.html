   if(g.z<0){S.last=v;msg("\u201C"+(v.length>22?v.slice(0,22)+"\u2026":v)+"\u201D isn\u2019t right \u2014 try another");inp.value="";inp.focus();return}
   if(!g.exact){inp.value=g.name;inp.focus();msg("Autocorrected \u2014 press Enter to lock it in");return}
   finish(v,g)}
  document.getElementById("sub").onclick=submit;inp.onkeydown=function(e){if(e.key==="Enter")submit()};
  clearInterval(S.tm);S.tm=setInterval(function(){S.left-=.25;var f=document.getElementById("bf"),tl=document.getElementById("tl");if(!f)return;f.style.width=(S.left/25*100)+"%";tl.textContent=Math.ceil(S.left);
   if(S.left<=0&&!done){var v=inp.value.trim()||S.last;finish(v,v?grade(q,v):{z:-1,name:""})}},250)}
 if(S.i===0){var n=3;ui.insertAdjacentHTML("beforeend",'<div class="cd" id="cd"><span>get set \u00B7 the clock starts in 3</span></div>');var c=document.querySelector("#cd span");
  var iv=setInterval(function(){n--;if(n<=0){clearInterval(iv);begin()}else c.textContent="get set \u00B7 the clock starts in "+n},1000)}
 else begin()}
function reveal(){var a=S.ans[S.ans.length-1],z=a.z,last=S.ans.length===7,qa=document.getElementById("qa"),ib=document.getElementById("inb");
 if(qa)qa.style.opacity=0;if(ib)ib.style.opacity=0;
 setTimeout(function(){ui.innerHTML="";var txt=a.a||"no answer";
  if(z<0){tg.textContent="\u2715 "+txt;tg.classList.add("on");setTimeout(function(){verdict(a,last)},900);return}
  var dur=1.3+z*.3;tg.textContent="\u201C"+txt+"\u201D \u25BC";tg.classList.add("on");bl.classList.add("spin");
  setTimeout(function(){bw.style.transition="bottom "+dur+"s cubic-bezier(.25,.1,.2,1)";bw.style.bottom=px(YM[z]);camTo(YM[z],dur);
   var t0=performance.now();(function tick(t){var p=Math.min(1,(t-t0)/(dur*1000));distEl.textContent=Math.round(DM[z]*(1-Math.pow(1-p,2.2)))+" m";
    if(p<1)requestAnimationFrame(tick);else land(a,last)})(t0)},350)},380)}
function land(a,last){var z=a.z,pu=document.createElement("div");bl.classList.remove("spin");document.getElementById("mk"+z).classList.add("hit");wd.classList.add("lnd");
 pu.className="pulse";pu.style.setProperty("--c",ZC[z]);bw.appendChild(pu);scrEl.textContent=total();setTimeout(function(){verdict(a,last)},550)}
function verdict(a,last){var z=a.z,off=z<0;
 ui.innerHTML='<div class="vd"><div class="zn" style="color:'+(off?"#ff7a6b":ZC[z])+'">'+(off?"Offside":ZN[z])+'</div><div class="st va">'+(a.a?"\u201C"+esc(a.a)+"\u201D":"(no answer)")+'</div><div class="st vp">'+(off?"+0 PTS":"+"+a.pts+" PTS \u00B7 "+DM[z]+" m")+'</div><div class="st vf">'+(off?"The flag\u2019s up. No score.":FL[z])+'</div></div><div class="nxt"><button id="nx">'+(last?"Full time":"Next kick")+' \u25BC</button></div>';
 var nx=document.getElementById("nx");nx.onclick=function(){if(last){if(!S.prac)save(S.ans);results()}else{S.i++;ask()}};nx.focus()}
function results(){resetCam();sc.className="scene dim";hud.style.opacity=1;var tot=total(),
 grid=S.ans.map(function(a){return a.z<0?"\u2B1B":ZE[a.z]}).join(""),cur=RK.filter(function(r){return tot>=r[2]})[0],share="outofthebox "+(S.prac?"practice":"#"+num)+"\n"+tot+"/700 \u2013 "+cur[0]+"\n"+grid;
 var h='<div class="page"><div class="col"><div class="mnb"><button class="mn" id="mn1">\u25C0 Menu</button></div><div class="sec">Full time<i>'+(S.prac?"practice round":"matchday #"+num)+'</i></div><div class="bigs">'+tot+'<span style="font-size:1rem;color:#8ea4b8">/700</span></div><div style="height:10px"></div>';
 RK.forEach(function(r){h+='<div class="rk'+(r===cur?" me":"")+'"><span>'+r[0]+'</span><span>'+r[1]+' pts</span></div>'});
 h+='<div class="sec">Your haul<i>every answer, in order</i></div>';
 S.ans.forEach(function(a,i){var q=Q[i];h+='<div class="row"><i class="dot'+(a.z<0?" off":"")+'" style="background:'+(a.z>=0?ZC[a.z]:"#000")+'"></i><div class="rb"><div class="rn">'+(a.a?esc(a.a):"(no answer)")+'</div><div class="rm">'+(i+1)+'. '+esc(q.p)+' \u00B7 '+(a.z>=0?ZN[a.z]:"Offside")+'</div><div class="rm">Furthest on our list: '+esc(rarest(q))+'</div></div><div class="rp"><b>+'+a.pts+'</b><span>'+(a.z>=0?DM[a.z]:0)+' m</span></div></div>'});
 h+='<div class="sec">Share</div><div class="grid">'+grid+'</div><div class="acts"><button class="cta" id="cp">Copy result</button><button class="cta alt" id="mn2">\u25C0 Back to menu</button></div><div class="tx" id="msg"></div></div></div>';
 ui.innerHTML=h;
 document.getElementById("mn1").onclick=toMenu;document.getElementById("mn2").onclick=toMenu;
 document.getElementById("cp").onclick=function(){var m=document.getElementById("msg");m.style.display="inline-block";try{navigator.clipboard.writeText(share).then(function(){m.textContent="Copied. Paste it in the group chat."},function(){m.textContent=share})}catch(e){m.textContent=share}}}
buildScene();start();
</script>
